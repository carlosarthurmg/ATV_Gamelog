<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameLog — Seu Catálogo de Jogos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">🎮 <span>GAME</span>LOG</div>
      <nav>
        <button class="nav-btn active" data-tab="jogos">Jogos</button>
        <button class="nav-btn" data-tab="categorias">Categorias</button>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main>

    <!-- ── TAB JOGOS ─────────────────────────────── -->
    <section id="tab-jogos" class="tab active">

      <div class="section-header">
        <h1>Catálogo de Jogos</h1>
        <button class="btn-primary" id="btn-novo-jogo">+ Novo Jogo</button>
      </div>

      <!-- Filtros -->
      <div class="filters">
        <input type="text" id="search-jogo" placeholder="🔍  Buscar por título..." />
        <select id="filter-categoria">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <!-- Grid de jogos -->
      <div id="jogos-grid" class="cards-grid">
        <div class="loading">Carregando jogos...</div>
      </div>
    </section>

    <!-- ── TAB CATEGORIAS ─────────────────────────── -->
    <section id="tab-categorias" class="tab">

      <div class="section-header">
        <h1>Categorias</h1>
        <button class="btn-primary" id="btn-nova-categoria">+ Nova Categoria</button>
      </div>

      <div id="categorias-list" class="cat-list">
        <div class="loading">Carregando categorias...</div>
      </div>
    </section>

  </main>

  <!-- ── MODAL JOGO ──────────────────────────────── -->
  <div id="modal-jogo" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-jogo-title">Novo Jogo</h2>
        <button class="close-modal" data-modal="modal-jogo">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="jogo-id" />
        <div class="form-row">
          <label>Título *</label>
          <input type="text" id="jogo-titulo" placeholder="Nome do jogo" />
        </div>
        <div class="form-row">
          <label>Descrição</label>
          <textarea id="jogo-descricao" rows="3" placeholder="Sobre o jogo..."></textarea>
        </div>
        <div class="form-cols">
          <div class="form-row">
            <label>Ano de lançamento</label>
            <input type="number" id="jogo-ano" placeholder="2024" min="1970" max="2030" />
          </div>
          <div class="form-row">
            <label>Plataforma</label>
            <input type="text" id="jogo-plataforma" placeholder="PC, PS5, Xbox..." />
          </div>
        </div>
        <div class="form-cols">
          <div class="form-row">
            <label>Nota (0–10)</label>
            <input type="number" id="jogo-nota" placeholder="9.5" step="0.1" min="0" max="10" />
          </div>
          <div class="form-row">
            <label>Categoria</label>
            <select id="jogo-categoria"></select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" data-modal="modal-jogo">Cancelar</button>
        <button class="btn-primary" id="btn-salvar-jogo">Salvar</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL CATEGORIA ─────────────────────────── -->
  <div id="modal-categoria" class="modal hidden">
    <div class="modal-box modal-box--sm">
      <div class="modal-header">
        <h2 id="modal-cat-title">Nova Categoria</h2>
        <button class="close-modal" data-modal="modal-categoria">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="cat-id" />
        <div class="form-row">
          <label>Nome *</label>
          <input type="text" id="cat-nome" placeholder="Ex: Corrida" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" data-modal="modal-categoria">Cancelar</button>
        <button class="btn-primary" id="btn-salvar-categoria">Salvar</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
